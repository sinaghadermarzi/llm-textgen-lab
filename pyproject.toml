[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-textgen-lab"
version = "0.1.0"
description = "Educational lab for LLM text generation and inference-time reasoning"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
api = [
  "openai>=1.0",
  "anthropic>=0.30",
  "google-genai>=1.0",
]
local = [
  "torch>=2.2",
  "transformers>=4.45",
  "accelerate>=0.30",
]
dev = [
  "pytest>=8.0",
  "ruff>=0.8",
  "jupyter>=1.0",
]
all = [
  "openai>=1.0",
  "anthropic>=0.30",
  "google-genai>=1.0",
  "torch>=2.2",
  "transformers>=4.45",
  "accelerate>=0.30",
  "pytest>=8.0",
  "ruff>=0.8",
  "jupyter>=1.0",
]

[tool.setuptools.packages.find]
include = ["llm_textgen_lab*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
