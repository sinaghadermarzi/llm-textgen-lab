# Starting points, not universal defaults. Check provider/model support first.

[openai_low]
provider = "openai"
model = "gpt-5.6"
reasoning_effort = "low"
max_new_tokens = 512

[openai_high]
provider = "openai"
model = "gpt-5.6"
reasoning_effort = "high"
max_new_tokens = 512

[anthropic_adaptive]
provider = "anthropic"
model = "claude-sonnet-4-6"
reasoning_effort = "medium"
max_new_tokens = 1024

[gemini_level]
provider = "gemini"
model = "gemini-3.5-flash"
reasoning_effort = "medium"
max_new_tokens = 512
